

name: Build Lucent APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Lucent source
        run: |
          mkdir -p source
          unzip -q lucent-android-source-v2.zip -d source

      - name: Locate Android project
        run: |
          echo "Checking project files..."
          find source -name gradlew -type f

      - name: Build Lucent APK
        run: |
          cd source/lucent-android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lucent-APK
          path: source/lucent-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
